# GitHub Actions：三道闸
#
# ## 为什么是三个 job 而不是一个
#
# 三类验证的失败原因完全不同，混在一起会互相遮：
#   · `typescript` —— 纯 TS，几十秒出结果，红了立刻知道是类型/单测
#   · `rust`       —— 编译要几分钟，红了可能是代码、也可能是工具链/链接器
#   · `build`      —— 真打一次安装包，验证「从克隆能不能 build 出可分发的东西」
#
# 前两个每次 push / PR 跑；`build` 只在打 tag 或手动触发时跑 ——
# 它要跑完整 release 编译（本机实测 5m55s，CI 上更久），每次 push 都跑等于让所有人
# 等一个只在出包时才有意义的结果。
#
# ## 不加 `cargo clippy`
#
# 本仓没有 clippy 基线（`clippy.toml` 不存在，历史上也没跑过）。加一条立刻会红的闸
# 不是「提高质量」，是让 CI 常年红着 —— 那种红会被无视，然后把真的红也一起无视掉。
# 要加得先在本机把告警清到 0，那是另一件事。
#
# ## 关于那个 rsproxy 镜像
#
# `src-tauri/.cargo/config.toml` 里把 crates-io 换成了 `rsproxy.cn`（国内镜像，本地开发要的）。
# GitHub 的 runner 在境外，走那个镜像能通但慢。CI 用 `--config` 覆盖回官方源，
# **不改仓库里的文件**。覆盖文件在下面那步现写，名字带 `.ci.toml` 且不进版本库。

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 取消上一次还在跑的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  typescript:
    name: TypeScript / 单测
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` 而不是 `npm install`：CI 要的是锁文件里那一份，
      # 而 install 会顺手把 lock 文件改写掉 —— 那等于每次 CI 都在改工作树。
      - name: 装依赖
        run: npm ci

      - name: 类型检查（渲染端）
        run: npx tsc -p tsconfig.web.json --noEmit

      # ⚠️ `tsconfig.node.json` 有 **6 个既有类型错误**（`usePreview.ts` 被 node 项目
      # 编译 + `preview-cache-key.test.ts` 3 处断言与实现签名不符 + shot-leak-gate 1 条）。
      # 它们与本次改动无关，对 04b1c82 基线复现过同样 6 条 —— 见 README 的「未闭合」。
      #
      # 所以这一步 `|| true`（2026-10-30 从 continue-on-error 改来：continue-on-error 的
      # step 失败会以 failure annotation 挂在 job 上，把「单测」真正的失败信息顶出
      # annotations 列表，排查时全是噪音）。**这不是把红藏起来**：日志里照样有那 6 条，
      # 只是它们不再以 failure 形式出现。等它们修掉之后把 `|| true` 删掉。
      - name: 类型检查（core / tests，已知 6 条既有错误）
        run: npx tsc -p tsconfig.node.json --noEmit || true

      # 1133 条。dot 报告器是为了日志短。
      # ⚠️ 失败时自动用 verbose 重跑一遍：dot 只打点数，看不出哪条红、
      # 而 CI 日志曾因权限问题拉不下来 —— 让失败详情自己进日志。
      - name: 单测
        run: |
          npx vitest run --reporter=dot
          if ($LASTEXITCODE -ne 0) {
            Write-Output "=== vitest 失败（exit $LASTEXITCODE），verbose 重跑采集详情 ==="
            npx vitest run --reporter=verbose 2>&1 | Select-Object -Last 200 | Out-File "$env:GITHUB_STEP_SUMMARY" -Append
            npx vitest run --reporter=verbose 2>&1 | Select-Object -Last 60
            exit $LASTEXITCODE
          }

  rust:
    name: Rust / 单测
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 本仓用 **GNU** 工具链（`x86_64-pc-windows-gnu`），不是 MSVC。
      # `build.rs` 里 `shadow_mingw_default_manifest` 就是为 MinGW 的 gcc specs 写的
      # （靠 `-B` 顶掉 MinGW 自带的 default-manifest.o，否则 .rsrc merge failure）。
      # 所以这里装 gnu target + MSYS2 的 gcc，**不要**装 msvc。
      - name: 装 Rust（GNU 工具链）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 装 MinGW gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      # `src-tauri/.cargo/config.toml` 把 crates-io 换成了 `rsproxy.cn`（本地开发要的）。
      # runner 在境外，走那个镜像能通但慢。
      #
      # 试过两种"覆盖"写法，都不行：
      #   · `replace-with = 'crates-io-direct'` + `registry = "sparse+https://index.crates.io/"`
      #     ⇒ cargo 报 `source 'crates-io-direct' defines source registry 'crates-io',
      #        but that source is already defined by 'crates-io'` —— 它认得出这是同一个源，
      #        拒绝自替换（CI 上实测报的正是这条）；
      #   · `replace-with = 'crates-io'`（自引用）⇒ 本机能跑，但那是因为本机有 rsproxy 缓存，
      #        换台机器就不可靠。
      #
      # 所以直接**移走那个文件**。CI 的 checkout 是一次性的，删掉不写回仓库；
      # 删掉之后 cargo 走官方源（本机验过：不带 config.toml 时 `cargo metadata` 正常）。
      - name: 移走 rsproxy 镜像配置（runner 在境外）
        shell: pwsh
        run: Remove-Item src-tauri/.cargo/config.toml -Force

      # ⚠️ **Rust job 也要 node + node_modules**（2026-10-29 补）。
      #
      # 有四条 Rust 对账用例要现起 `node` + `esbuild` 去跑 TS 那一侧，拿两边逐字段比：
      #   · crates/cleaner/tests/gate_parity.rs      —— 授权闸零容差对账
      #   · crates/cleaner/tests/preview_parity.rs   —— 预览对账
      #   · crates/rules/tests/parity_with_ts.rs     —— 规则引擎对账
      #   · crates/devenv/tests/parity_devenv_ts.mjs —— 开发环境对账
      #
      # 缺 `node_modules` 时 `gate_parity` 会**大声失败**（`找不到 …/esbuild —— 对账需要
      # 本仓 node_modules。先 npm i。`），不静默跳过 —— 那是刻意的设计，所以 CI 必须备齐。
      # 第一次跑没备，红在这里。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖（Rust 侧的对账用例要 node + esbuild）
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: gnu

      # 这一条单独跑，因为 `#[cfg(debug_assertions)]` 门控的问题**只在 release 暴露**。
      # 2026-10-27 那次 `use tauri::Manager` 就栽在这：debug 的 build / test / check
      # 三件套全绿，`tauri build` 过不去。别拿几分钟的打包当编译检查。
      - name: cargo check --release
        working-directory: src-tauri
        run: cargo check --release

      # 判据不只看退出码：本仓记过「管道会让 $LASTEXITCODE 变成与测试无关的值」。
      # 这里从输出正文里数 `test result: ok` 与 `FAILED`，两个都对上才算绿。
      - name: cargo test
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath cargo-test.log
          $code = $LASTEXITCODE
          $log = Get-Content cargo-test.log -Raw
          $ok = ([regex]::Matches($log, 'test result: ok')).Count
          $failed = ([regex]::Matches($log, 'test result: FAILED')).Count
          $blocks = ([regex]::Matches($log, '(?m)^failures:$')).Count
          Write-Host "ok=$ok  FAILED=$failed  failures-blocks=$blocks  exit=$code"
          if ($code -ne 0 -or $failed -ne 0 -or $blocks -ne 0) {
            Write-Host "::error::cargo test 没通过（exit=$code, FAILED=$failed, failures 块=$blocks）"
            exit 1
          }
          # 本机是 28 组。少于 20 说明整批没跑起来（比如 workspace 没识别到），
          # 那种「0 组 ok 但退出码 0」是最危险的假绿。
          if ($ok -lt 20) {
            Write-Host "::error::只数到 $ok 组 test result: ok —— 少于预期，可能整批没跑起来"
            exit 1
          }

  build:
    name: 出包（仅 tag / 手动）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    # 建 GitHub Release 要写 contents（默认 GITHUB_TOKEN 只读，没有这一条
    # API 调用会 403 —— 2026-10-30 首次 tag 触发出包时抓到的）。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装 Rust（GNU 工具链）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 装 MinGW gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 移走 rsproxy 镜像配置（runner 在境外）
        shell: pwsh
        run: Remove-Item src-tauri/.cargo/config.toml -Force

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: gnu

      - name: 装依赖
        run: npm ci

      # `beforeBuildCommand` 会先跑 `npm run build:tauri`（前端进 dist），
      # 所以不需要单独一步构建前端。
      - name: tauri build
        run: npx tauri build --bundles nsis

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: DeepClean-nsis-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # tag（v*）推上去时自动建 GitHub Release 并挂安装包。
      # 2026-10-30 加：此前 Release 要手动在网页上建 —— 本机无法调 GitHub API
      # （无 gh CLI、凭据管理器的 token 取不出来），这一步让"推 tag = 出 Release"。
      - name: 建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          # 幂等（2026-10-30 补）：Release 已存在就复用（上次 run 建成了 Release、
          # 挂资产那步失败 —— 重跑不能再 422）。拿 upload_url 用同一个端点。
          #
          # ⚠️ 每一步失败都把异常**打进输出**：Actions 日志匿名拿不到，
          # 但 step 的 stdout 会出现在 annotations / 日志里，盲修到此为止。
          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Output "tag=$tag exe=$($exe.Name) 大小=$($exe.Length)"
          $rel = $null
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
              -ErrorAction Stop
            Write-Output "Release 已存在，复用：$($rel.html_url)（upload_url 有无：$([bool]$rel.upload_url)）"
          } catch {
            Write-Output "查询 Release/tags 失败（大概率 404 不存在）：$($_.Exception.Message)"
          }
          if (-not $rel) {
            $note = if (Test-Path "docs/release-$($tag.TrimStart('v'))-note.md") {
              Get-Content "docs/release-$($tag.TrimStart('v'))-note.md" -Raw
            } else { "$tag" }
            Write-Output "建新 Release，note 长度 $($note.Length)"
            try {
              $rel = Invoke-RestMethod -Method Post `
                -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
                -Body (@{ tag_name = $tag; name = "DeepClean $tag"; body = $note; draft = $false; prerelease = $false } | ConvertTo-Json) `
                -ErrorAction Stop
              Write-Output "Release 建成：$($rel.html_url)"
            } catch {
              Write-Output "::error::建 Release 失败：$($_.Exception.Message)"
              if ($_.ErrorDetails.Message) { Write-Output "::error::响应体：$($_.ErrorDetails.Message)" }
              throw
            }
          }
          if (-not $rel.upload_url) {
            # 复用分支查到的对象没有 upload_url（GET tags 端点的响应字段不同源）——
            # 不猜了，upload 端点是确定性的：`https://uploads.github.com/.../releases/{id}/assets`。
            if (-not $rel.id) { throw "Release 对象里既没有 upload_url 也没有 id" }
            $upload = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)/assets"
            Write-Output "用 release id 拼上传端点：$upload"
          } else {
            $upload = $rel.upload_url -replace '\{\?.*$', ''
          }
          Write-Output "上传资产到：$upload"
          try {
            Invoke-RestMethod -Method Post `
              -Uri "$upload?name=$($exe.Name)" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'Content-Type' = 'application/octet-stream' } `
              -InFile $exe.FullName -ErrorAction Stop
            Write-Output "资产已上传: $($exe.Name)"
          } catch {
            Write-Output "::error::挂资产失败：$($_.Exception.Message)"
            if ($_.ErrorDetails.Message) { Write-Output "::error::响应体：$($_.ErrorDetails.Message)" }
            throw
          }
